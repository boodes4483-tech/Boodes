name: Build Boodes APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip build-essential \
            python3-pip python3-venv libffi-dev libssl-dev \
            zlib1g-dev libncurses-dev cmake libltdl-dev

      - name: Prepare project
        run: |
          cp newfile.py main.py
          sed -i 's|FONT_PATH = "/storage/emulated/0/Download/NotoNaskhArabic\[wght\].ttf"|FONT_PATH = os.path.join(os.path.dirname(__file__), "NotoNaskhArabic.ttf")|' main.py

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --break-system-packages buildozer cython

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boodes-APK
          path: bin/*.apk
