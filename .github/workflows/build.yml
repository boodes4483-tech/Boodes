
name: Build Boodes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            python3-venv \
            libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            cmake libltdl-dev \
            autoconf automake libtool pkg-config

      - name: Verify environment
        run: |
          python --version
          java -version
          python -c "import sys; assert sys.version_info[:2] == (3, 11)"

      - name: Set up build environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            buildozer \
            Cython==0.29.36 \
            virtualenv

          buildozer --version
          cython --version

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          test -f NotoNaskhArabic.ttf

      - name: Clean old build
        run: |
          source .venv/bin/activate
          buildozer android clean || true

      - name: Build Boodes APK
        run: |
          source .venv/bin/activate
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK archive
        run: |
          set -e

          APK=$(find bin -maxdepth 1 -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK: $APK"
          ls -lh "$APK"
          unzip -t "$APK"

          sha256sum "$APK" | tee apk-sha256.txt

      - name: Verify APK signature and package
        run: |
          set -e

          APK=$(find bin -maxdepth 1 -name "*.apk" | head -n 1)
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          APKSIGNER=$(find "$SDK/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          AAPT=$(find "$SDK/build-tools" \
            -type f -name aapt | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "ERROR: Android verification tools not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          "$AAPT" dump badging "$APK" | tee apk-info.txt

          echo "APK signature and package checks completed."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Boodes-APK
          path: |
            bin/*.apk
            apk-sha256.txt
            apk-info.txt
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Boodes-Build-Logs
          path: |
            build.log
            apk-sha256.txt
            apk-info.txt
          if-no-files-found: warn
