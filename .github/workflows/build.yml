
name: Build Boodes APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip build-essential \
            python3-pip \
            libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libltdl-dev \
            autoconf automake libtool pkg-config

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools
          python3 -m pip install --user --upgrade buildozer "Cython==0.29.34" "wheel==0.43.0" virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          python3 -m pip show Cython
          cython --version
          buildozer --version

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec

      - name: Build APK
        run: |
          set -o pipefail
          (yes || true) | buildozer -v android debug 2>&1 | tee build.log

      - name: Save Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Boodes-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boodes-APK
          path: bin/*.apk
          if-no-files-found: error
